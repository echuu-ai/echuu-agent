name: tests

# Roadmap item #1 (docs/research/2026-09-12-harness-and-vtuber-roadmap.md):
# run the pytest suite automatically on every push/PR instead of relying on
# someone remembering to run it locally. The suite is fully self-contained
# (fake LLM/TTS doubles, no network or API keys) so this needs no secrets.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest tests -q
